name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          VERSION=$(node -p "require('./packages/route-forge/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Expected tag v$VERSION, received $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Check types
        run: pnpm check-types

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Test API end to end
        run: pnpm test:e2e

      - name: Validate npm package
        run: pnpm --filter @dannyjgg/route-forge package:check

      - name: Ensure version is unpublished
        run: |
          VERSION=$(node -p "require('./packages/route-forge/package.json').version")
          if npm view "@dannyjgg/route-forge@$VERSION" version > /dev/null 2>&1; then
            echo "@dannyjgg/route-forge@$VERSION already exists on npm"
            exit 1
          fi

      - name: Stage package for approval
        working-directory: packages/route-forge
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_V }}
          NPM_CONFIG_PROVENANCE: true
